<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drive History - CalmDrive Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
<style type="text/tailwindcss">
@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-card: var(--card);
  --color-border: var(--border);
  --font-font-sans: var(--font-sans);
  --font-font-heading: var(--font-heading);
  --font-font-mono: var(--font-mono);
  --radius-lg: var(--radius);
}
:root {
  --background: #0f172a;
  --foreground: #f1f5f9;
  --primary: #7dd3fc;
  --primary-foreground: #0f172a;
  --secondary: #334155;
  --muted: #1e293b;
  --muted-foreground: #94a3b8;
  --card: #1e293b;
  --border: #334155;
  --font-sans: "Manrope";
  --font-heading: "Space Grotesk";
  --font-mono: "JetBrains Mono";
  --radius: 0.75rem;
}
</style>
</head>
<body>
<div class="flex flex-col h-full bg-background font-sans text-foreground relative overflow-hidden">
  <div class="absolute top-6 left-1/2 -translate-x-1/2 flex items-center gap-2 z-10">
    <img src="icon-plus-192.png" alt="CalmDrive" class="size-8 rounded-lg shadow-lg shadow-primary/20" />
    <span class="text-sm font-heading font-bold text-foreground tracking-wide">Calm Drive</span>
  </div>

  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[120%] h-96 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>

  <header class="pt-16 px-6 pb-4 z-10">
    <button onclick="goBack()" class="mb-4 flex items-center gap-2 text-muted-foreground hover:text-foreground transition-colors">
      <iconify-icon icon="solar:arrow-left-linear" class="size-5"></iconify-icon>
      <span class="text-sm font-medium">Back</span>
    </button>
    <h1 class="text-3xl font-heading font-bold text-foreground tracking-tight">Drive History</h1>
    <p class="text-muted-foreground mt-1">Your calm driving journey</p>
  </header>

  <main class="flex-1 overflow-y-auto px-6 space-y-3 pb-32 z-10">
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="bg-card p-4 rounded-2xl border border-border/50 shadow-lg text-center">
        <iconify-icon icon="solar:steering-wheel-bold" class="size-6 text-primary mx-auto mb-2"></iconify-icon>
        <div id="totalDrives" class="text-2xl font-mono font-bold text-foreground">0</div>
        <div class="text-xs text-muted-foreground uppercase tracking-wider mt-1">Total Drives</div>
      </div>
      <div class="bg-card p-4 rounded-2xl border border-border/50 shadow-lg text-center">
        <iconify-icon icon="solar:heart-pulse-bold" class="size-6 text-primary mx-auto mb-2"></iconify-icon>
        <div id="avgCalm" class="text-2xl font-mono font-bold text-primary">--</div>
        <div class="text-xs text-muted-foreground uppercase tracking-wider mt-1">Avg Calm</div>
      </div>
      <div class="bg-card p-4 rounded-2xl border border-border/50 shadow-lg text-center">
        <iconify-icon icon="solar:clock-circle-bold" class="size-6 text-primary mx-auto mb-2"></iconify-icon>
        <div id="totalTime" class="text-2xl font-mono font-bold text-foreground">0</div>
        <div class="text-xs text-muted-foreground uppercase tracking-wider mt-1">Total Mins</div>
      </div>
    </div>

    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-bold text-muted-foreground uppercase tracking-widest">Recent Drives</span>
      <select onchange="filterDrives(this.value)" class="bg-card border border-border/50 rounded-lg px-3 py-1.5 text-sm text-foreground">
        <option value="all">All Time</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
      </select>
    </div>

    <div id="driveList"></div>

    <div id="emptyState" class="hidden text-center py-16 space-y-3">
      <iconify-icon icon="solar:steering-wheel-bold" class="size-16 text-muted-foreground mx-auto opacity-30"></iconify-icon>
      <p class="text-muted-foreground">No drives yet!</p>
      <p class="text-sm text-muted-foreground">Complete your first drive to see it here.</p>
    </div>
  </main>

  <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background via-background/95 to-transparent z-20">
    <button onclick="startNewDrive()" class="w-full h-14 bg-primary text-primary-foreground font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
      <iconify-icon icon="solar:steering-wheel-bold" class="size-5"></iconify-icon>
      New Drive
    </button>
  </div>
</div>

<script>
  const BASE = 'https://mjuve21-spec.github.io/calmdriveapp/plus/';
  let allDrives = [];

  window.onload = function() {
    allDrives = JSON.parse(localStorage.getItem('driveHistory') || '[]');
    renderDrives(allDrives);
    updateStats(allDrives);
  };

  function updateStats(drives) {
    document.getElementById('totalDrives').textContent = drives.length;
    if (drives.length > 0) {
      const avgCalm = Math.round(drives.reduce((a, b) => a + b.calmScore, 0) / drives.length);
      document.getElementById('avgCalm').textContent = avgCalm + '%';
      let totalMins = 0;
      drives.forEach(d => {
        const parts = d.duration.split(':');
        totalMins += parseInt(parts[0] || 0);
      });
      document.getElementById('totalTime').textContent = totalMins;
    }
  }

  function renderDrives(drives) {
    const list = document.getElementById('driveList');
    const empty = document.getElementById('emptyState');
    if (drives.length === 0) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    list.innerHTML = drives.map(drive => {
      const stateColor = drive.state === 'Flow' ? 'text-emerald-400' : drive.state === 'Calm' ? 'text-primary' : 'text-yellow-400';
      const stateBg = drive.state === 'Flow' ? 'bg-emerald-500/20' : drive.state === 'Calm' ? 'bg-primary/20' : 'bg-yellow-500/20';
      const stateIcon = drive.state === 'Flow' ? 'solar:leaf-bold' : drive.state === 'Calm' ? 'solar:check-circle-bold' : 'solar:shield-warning-bold';
      return `
        <div class="bg-card p-5 rounded-2xl border border-border/50 shadow-lg space-y-3 mb-3">
          <div class="flex items-start justify-between">
            <div>
              <div class="text-xs text-muted-foreground mb-1">${drive.date} at ${drive.time}</div>
              <div class="font-semibold text-lg">${drive.destination !== 'Unknown' ? 'To: ' + drive.destination : 'No destination set'}</div>
            </div>
            <div class="flex items-center gap-1.5 ${stateBg} px-3 py-1.5 rounded-full">
              <iconify-icon icon="${stateIcon}" class="size-4 ${stateColor}"></iconify-icon>
              <span class="text-sm font-bold ${stateColor}">${drive.state}</span>
            </div>
          </div>
          <div class="grid grid-cols-4 gap-2 pt-2 border-t border-border/30">
            <div class="text-center">
              <div class="text-sm font-mono font-bold text-primary">${drive.calmScore}%</div>
              <div class="text-[10px] text-muted-foreground uppercase tracking-wider">Calm</div>
            </div>
            <div class="text-center">
              <div class="text-sm font-mono font-bold">${drive.duration}</div>
              <div class="text-[10px] text-muted-foreground uppercase tracking-wider">Time</div>
            </div>
            <div class="text-center">
              <div class="text-sm font-mono font-bold">${String(drive.breathCount).padStart(2, '0')}</div>
              <div class="text-[10px] text-muted-foreground uppercase tracking-wider">Breaths</div>
            </div>
            <div class="text-center">
              <div class="text-sm font-mono font-bold">${String(drive.deEscCount).padStart(2, '0')}</div>
              <div class="text-[10px] text-muted-foreground uppercase tracking-wider">De-esc</div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterDrives(period) {
    if (period === 'all') { renderDrives(allDrives); updateStats(allDrives); return; }
    const now = new Date();
    const filtered = allDrives.filter(drive => {
      const diff = now - new Date(drive.id);
      if (period === 'week') return diff < 7 * 24 * 60 * 60 * 1000;
      if (period === 'month') return diff < 30 * 24 * 60 * 60 * 1000;
      return true;
    });
    renderDrives(filtered);
    updateStats(filtered);
  }

  function goBack() {
    window.location.href = BASE + 'pre-drive-setup.html';
  }

  function startNewDrive() {
    window.location.href = BASE + 'pre-drive-setup.html';
  }
</script>
</body>
</html>
