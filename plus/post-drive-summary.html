<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostDriveSummary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-border: var(--border);
        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-mono: var(--font-mono);
      }

      :root {
        --background: #0f172a;
        --foreground: #f1f5f9;
        --primary: #7dd3fc;
        --primary-foreground: #0f172a;
        --secondary: #334155;
        --secondary-foreground: #f1f5f9;
        --muted: #1e293b;
        --muted-foreground: #94a3b8;
        --destructive: #ef4444;
        --card: #1e293b;
        --card-foreground: #f1f5f9;
        --border: #334155;
        --font-sans: "Manrope";
        --font-heading: "Space Grotesk";
        --font-mono: "JetBrains Mono";
        --radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="flex flex-col h-full bg-background font-sans text-foreground relative overflow-hidden">
      <div class="absolute top-6 left-1/2 -translate-x-1/2 flex items-center gap-2 z-10">
        <img src="icon-plus-192.png" alt="CalmDrive" class="size-8 rounded-lg shadow-lg shadow-primary/20" />
        <span class="text-sm font-heading font-bold text-foreground tracking-wide">Calm Drive</span>
      </div>
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[120%] h-96 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>

      <header class="pt-16 px-6 pb-6 text-center z-10">
        <div class="size-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-primary/20">
          <iconify-icon icon="solar:check-circle-bold" class="size-10 text-primary"></iconify-icon>
        </div>
        <h1 class="text-4xl font-heading font-bold text-foreground tracking-tight mb-2">Drive Complete</h1>
        <p id="summarySubtitle" class="text-muted-foreground text-lg max-w-[280px] mx-auto">You maintained a peaceful state throughout your journey.</p>
      </header>

      <main class="flex-1 overflow-y-auto px-6 space-y-4 pb-32 z-10">

        <!-- Calmness Score -->
        <div class="bg-card p-6 rounded-3xl border border-border/50 shadow-xl">
          <div class="flex justify-between items-center mb-4">
            <div>
              <span class="text-xs font-bold text-muted-foreground uppercase tracking-widest">Average Calmness</span>
              <div class="flex items-baseline gap-1 mt-1">
                <span id="calmScore" class="text-4xl font-mono font-bold text-primary">--</span>
                <span class="text-xl font-mono text-primary/70">%</span>
              </div>
            </div>
            <div class="p-3 bg-primary/10 rounded-2xl">
              <iconify-icon icon="solar:heart-pulse-bold" class="size-8 text-primary"></iconify-icon>
            </div>
          </div>
          <!-- Destination -->
          <div class="flex items-center gap-2 mt-2">
            <iconify-icon icon="solar:map-point-bold" class="size-4 text-muted-foreground"></iconify-icon>
            <span id="destinationText" class="text-sm text-muted-foreground">Unknown destination</span>
          </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-card p-4 rounded-3xl border border-border/50 shadow-lg">
            <iconify-icon icon="solar:clock-circle-bold" class="size-6 text-primary mb-3"></iconify-icon>
            <div class="space-y-1">
              <span id="driveDuration" class="block text-2xl font-mono font-bold">--:--</span>
              <span class="block text-xs text-muted-foreground uppercase tracking-wider">Drive Time</span>
            </div>
          </div>
          <div class="bg-card p-4 rounded-3xl border border-border/50 shadow-lg">
            <iconify-icon icon="solar:wind-bold" class="size-6 text-primary mb-3"></iconify-icon>
            <div class="space-y-1">
              <span id="breathCount" class="block text-2xl font-mono font-bold">--</span>
              <span class="block text-xs text-muted-foreground uppercase tracking-wider">Exercises</span>
            </div>
          </div>
          <div class="bg-card p-4 rounded-3xl border border-border/50 shadow-lg">
            <iconify-icon icon="solar:calendar-bold" class="size-6 text-primary mb-3"></iconify-icon>
            <div class="space-y-1">
              <span id="driveDate" class="block text-lg font-mono font-bold">--</span>
              <span class="block text-xs text-muted-foreground uppercase tracking-wider">Date</span>
            </div>
          </div>
          <div class="bg-card p-4 rounded-3xl border border-border/50 shadow-lg">
            <iconify-icon id="stateIcon" icon="solar:leaf-bold" class="size-6 text-emerald-400 mb-3"></iconify-icon>
            <div class="space-y-1">
              <span id="driveState" class="block text-2xl font-mono font-bold text-emerald-400">--</span>
              <span class="block text-xs text-muted-foreground uppercase tracking-wider">Overall State</span>
            </div>
          </div>
        </div>

        <!-- Insights -->
        <div class="bg-primary/5 p-6 rounded-3xl border border-primary/10 space-y-3">
          <div class="flex items-center gap-2">
            <iconify-icon icon="solar:magic-stick-3-bold" class="size-5 text-primary"></iconify-icon>
            <span class="font-semibold text-primary">Personal Insights</span>
          </div>
          <p id="insightText" class="text-foreground leading-relaxed">Loading your insights...</p>
          <div class="h-px bg-primary/10 w-full"></div>
          <p id="tipText" class="text-muted-foreground text-sm leading-relaxed italic">Loading tip...</p>
        </div>
      </main>

      <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background via-background/95 to-transparent z-20">
        <div class="flex flex-col gap-3">
          <button onclick="finishDrive()" class="w-full h-14 bg-primary text-primary-foreground font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
            Done
          </button>
          <button onclick="viewHistory()" class="w-full h-14 bg-secondary text-secondary-foreground font-bold rounded-2xl flex items-center justify-center gap-2 border border-border/50 active:scale-[0.98] transition-transform">
            <iconify-icon icon="solar:history-bold" class="size-5"></iconify-icon>View History
          </button>
        </div>
      </div>
    </div>

    <script>
      // ─── Load Real Drive Data ──────────────────────────────────
      window.onload = function() {
        const drive = JSON.parse(localStorage.getItem('lastDrive') || 'null');

        if (drive) {
          document.getElementById('calmScore').textContent = drive.calmScore;
          document.getElementById('driveDuration').textContent = drive.duration;
          document.getElementById('breathCount').textContent = drive.breathCount;
          document.getElementById('driveDate').textContent = drive.date;
          document.getElementById('destinationText').textContent = drive.destination !== 'Unknown' ? 'To: ' + drive.destination : 'No destination set';

          // State
          const stateEl = document.getElementById('driveState');
          const stateIcon = document.getElementById('stateIcon');
          stateEl.textContent = drive.state;
          if (drive.state === 'Flow') {
            stateEl.className = 'block text-2xl font-mono font-bold text-emerald-400';
            stateIcon.setAttribute('icon', 'solar:leaf-bold');
            stateIcon.className = 'size-6 text-emerald-400 mb-3';
          } else if (drive.state === 'Calm') {
            stateEl.className = 'block text-2xl font-mono font-bold text-primary';
            stateIcon.setAttribute('icon', 'solar:check-circle-bold');
            stateIcon.className = 'size-6 text-primary mb-3';
          } else {
            stateEl.className = 'block text-2xl font-mono font-bold text-yellow-400';
            stateIcon.setAttribute('icon', 'solar:shield-warning-bold');
            stateIcon.className = 'size-6 text-yellow-400 mb-3';
          }

          // Subtitle
          if (drive.calmScore >= 85) {
            document.getElementById('summarySubtitle').textContent = 'You maintained a peaceful state throughout your journey.';
          } else if (drive.calmScore >= 70) {
            document.getElementById('summarySubtitle').textContent = 'Good drive! You stayed mostly calm throughout.';
          } else {
            document.getElementById('summarySubtitle').textContent = 'Challenging drive. Every drive is a chance to improve.';
          }

          // Insights
          const score = drive.calmScore;
          const mins = drive.duration;
          if (score >= 85) {
            document.getElementById('insightText').textContent = `Excellent drive! You scored ${score}% calmness over ${mins} minutes. Your breathing exercises made a real difference.`;
            document.getElementById('tipText').textContent = 'Tip: Keep using the breathing exercises - they\'re clearly working for you!';
          } else if (score >= 70) {
            document.getElementById('insightText').textContent = `Good drive! You scored ${score}% calmness over ${mins} minutes. There were some tense moments but you handled them well.`;
            document.getElementById('tipText').textContent = 'Tip: Try the 6s breathing interval next time for deeper relaxation.';
          } else {
            document.getElementById('insightText').textContent = `You scored ${score}% calmness over ${mins} minutes. It was a tough drive but you made it through.`;
            document.getElementById('tipText').textContent = 'Tip: Try leaving a few minutes earlier next time to reduce rush-related stress.';
          }
        } else {
          // No drive data found
          document.getElementById('calmScore').textContent = '--';
          document.getElementById('driveDuration').textContent = '--:--';
          document.getElementById('breathCount').textContent = '--';
          document.getElementById('driveDate').textContent = '--';
          document.getElementById('insightText').textContent = 'Complete a drive to see your personal insights here.';
          document.getElementById('tipText').textContent = 'Start your first drive to begin tracking your calmness journey.';
        }
      };

      function finishDrive() {
        window.location.href = 'pre-drive-setup.html';
      }

      function viewHistory() {
        window.location.href = 'drive-history.html';
      }
    </script>
  </body>
</html>
