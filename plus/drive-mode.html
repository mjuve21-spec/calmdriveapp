<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActiveDrive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);
        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --tracking-tighter: calc(var(--tracking-normal) - 0.05em);
        --tracking-tight: calc(var(--tracking-normal) - 0.025em);
        --tracking-wide: calc(var(--tracking-normal) + 0.025em);
        --tracking-wider: calc(var(--tracking-normal) + 0.05em);
        --tracking-widest: calc(var(--tracking-normal) + 0.1em);
        --tracking-normal: var(--tracking-normal);
      }

      :root {
        --background: #0f172a;
        --foreground: #f1f5f9;
        --primary: #7dd3fc;
        --primary-foreground: #0f172a;
        --secondary: #334155;
        --secondary-foreground: #f1f5f9;
        --muted: #1e293b;
        --muted-foreground: #94a3b8;
        --accent: #334155;
        --accent-foreground: #f1f5f9;
        --destructive: #ef4444;
        --card: #1e293b;
        --card-foreground: #f1f5f9;
        --popover: #1e293b;
        --popover-foreground: #f1f5f9;
        --border: #334155;
        --input: #1e293b;
        --ring: #7dd3fc;
        --chart-1: #7dd3fc;
        --chart-2: #5eead4;
        --chart-3: #a5b4fc;
        --chart-4: #94a3b8;
        --chart-5: #cbd5e1;
        --font-sans: "Manrope";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";
        --radius: 0.75rem;
      }

      @keyframes breatheIn {
        0% { transform: scale(1); box-shadow: 0 0 20px -10px rgba(125,211,252,0.3); }
        100% { transform: scale(1.2); box-shadow: 0 0 60px -5px rgba(125,211,252,0.6); }
      }

      @keyframes breatheOut {
        0% { transform: scale(1.2); box-shadow: 0 0 60px -5px rgba(125,211,252,0.6); }
        100% { transform: scale(1); box-shadow: 0 0 20px -10px rgba(125,211,252,0.3); }
      }

      @keyframes holdBreath {
        0%, 100% { transform: scale(1.2); box-shadow: 0 0 60px -5px rgba(125,211,252,0.6); }
      }

      .breathing-circle { transition: all 0.3s ease; }
      .breathe-in { animation: breatheIn var(--breath-duration) ease-in-out forwards; }
      .breathe-out { animation: breatheOut var(--breath-duration) ease-in-out forwards; }
      .breathe-hold { animation: holdBreath var(--breath-duration) ease-in-out forwards; }
    </style>
  </head>
  <body>
    <div class="flex flex-col h-full bg-background font-sans text-foreground relative overflow-hidden">
      <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>

      <div class="absolute top-6 left-1/2 -translate-x-1/2 flex items-center gap-2 z-10">
        <img src="icon-plus-192.png" alt="CalmDrive" class="size-8 rounded-lg shadow-lg shadow-primary/20" />
        <span class="text-sm font-heading font-bold text-foreground tracking-wide">Calm Drive</span>
      </div>

      <header class="pt-12 px-6 flex justify-between items-start z-10">
        <div class="flex flex-col">
          <div class="flex items-baseline gap-3">
            <h1 id="speedValue" class="text-8xl font-mono font-bold tracking-tighter text-foreground leading-none">64</h1>
            <div class="flex flex-col gap-1">
              <button id="unitToggle" class="text-xl font-medium transition-colors cursor-pointer hover:text-primary">
                <span id="currentUnit" class="text-primary">MPH</span>
              </button>
              <span id="altSpeed" class="text-xs text-muted-foreground">103 KPH</span>
            </div>
          </div>
        </div>
        <div class="flex flex-col items-center justify-center p-3 rounded-2xl border border-white/10 bg-card/50 backdrop-blur-sm">
          <span class="text-xs font-bold text-muted-foreground uppercase tracking-widest mb-1">LIMIT</span>
          <div class="size-10 rounded-full border-2 border-destructive flex items-center justify-center bg-white/5">
            <span id="speedLimit" class="text-lg font-bold font-mono">60</span>
          </div>
          <span id="limitUnit" class="text-[10px] text-muted-foreground mt-0.5">MPH</span>
        </div>
      </header>

      <main class="flex-1 flex flex-col items-center justify-center relative z-10 px-6 space-y-10">
        <div class="relative flex items-center justify-center py-8">
          <div class="absolute size-72 rounded-full border border-primary/20 scale-110 opacity-20"></div>
          <div class="absolute size-64 rounded-full border border-primary/30 scale-105 opacity-40"></div>
          <div id="breathingCircle" class="breathing-circle size-56 rounded-full bg-gradient-to-br from-primary/20 to-primary/5 border border-primary/40 backdrop-blur-md flex items-center justify-center" style="--breath-duration: 4s">
            <div class="text-center space-y-1">
              <span id="breathText" class="block text-sm font-medium text-primary uppercase tracking-widest">Inhale</span>
              <iconify-icon icon="solar:wind-bold" class="size-10 text-primary mx-auto opacity-80"></iconify-icon>
              <span id="breathTimer" class="block text-2xl font-mono font-bold text-primary">4</span>
            </div>
          </div>
        </div>
        <div class="text-center space-y-2">
          <h2 id="encouragement" class="text-3xl font-heading font-medium text-foreground tracking-tight">You're doing great</h2>
          <p class="text-lg text-muted-foreground">Traffic is light. Relax your shoulders.</p>
        </div>
      </main>

      <div class="px-6 pb-8 z-10">
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-card p-4 rounded-2xl flex flex-col items-center justify-center text-center space-y-1 shadow-lg border border-border/50">
            <iconify-icon icon="solar:routing-2-bold" class="size-6 text-primary mb-1"></iconify-icon>
            <span id="distance" class="text-xl font-bold font-mono text-foreground">12.4</span>
            <span id="distanceUnit" class="text-xs text-muted-foreground uppercase tracking-wider">Miles</span>
          </div>
          <div class="bg-card p-4 rounded-2xl flex flex-col items-center justify-center text-center space-y-1 shadow-lg border border-border/50">
            <iconify-icon icon="solar:clock-circle-bold" class="size-6 text-primary mb-1"></iconify-icon>
            <span class="text-xl font-bold font-mono text-foreground">5:42</span>
            <span class="text-xs text-muted-foreground uppercase tracking-wider">Arrival</span>
          </div>
          <div class="bg-card p-4 rounded-2xl flex flex-col items-center justify-center text-center space-y-1 shadow-lg border border-border/50">
            <iconify-icon icon="solar:traffic-bold" class="size-6 text-emerald-400 mb-1"></iconify-icon>
            <span class="text-xl font-bold text-emerald-400">Clear</span>
            <span class="text-xs text-muted-foreground uppercase tracking-wider">Traffic</span>
          </div>
        </div>
      </div>

      <div class="px-6 pb-8 z-10">
        <div class="h-20 bg-card rounded-3xl flex items-center justify-between px-2 shadow-xl border border-border/50">
          <button onclick="toggleAudio()" class="flex-1 flex flex-col items-center justify-center gap-1 h-full rounded-2xl active:bg-white/5 transition-colors group">
            <div id="audioBtn" class="p-2 rounded-full bg-background/50 group-hover:bg-primary/20 transition-colors">
              <iconify-icon icon="solar:music-library-2-bold" class="size-6 text-primary"></iconify-icon>
            </div>
            <span id="audioLabel" class="text-[10px] font-medium text-muted-foreground">Calm Audio</span>
          </button>
          <div class="w-px h-8 bg-border/50"></div>
          <button onclick="endDrive()" class="flex-1 flex flex-col items-center justify-center gap-1 h-full rounded-2xl active:bg-white/5 transition-colors">
            <div class="size-14 rounded-full bg-destructive flex items-center justify-center shadow-lg shadow-destructive/20 border-4 border-card -mt-8">
              <iconify-icon icon="solar:stop-bold" class="size-6 text-white"></iconify-icon>
            </div>
            <span class="text-[10px] font-medium text-destructive mt-1">End Drive</span>
          </button>
          <div class="w-px h-8 bg-border/50"></div>
          <button onclick="openSettings()" class="flex-1 flex flex-col items-center justify-center gap-1 h-full rounded-2xl active:bg-white/5 transition-colors group">
            <div class="p-2 rounded-full bg-background/50 group-hover:bg-primary/20 transition-colors">
              <iconify-icon icon="solar:settings-bold" class="size-6 text-primary"></iconify-icon>
            </div>
            <span class="text-[10px] font-medium text-muted-foreground">Settings</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      // ─── Read Settings from localStorage ──────────────────────
      const savedInterval = localStorage.getItem('breathInterval') || '4s';
      const breathSeconds = parseInt(savedInterval);
      const voicePreference = localStorage.getItem('voicePreference') || 'random';
      const breathingEnabled = localStorage.getItem('breathingEnabled') !== 'false';
      const voiceEnabled = localStorage.getItem('voiceEnabled') === 'true';

      // ─── Audio Files ───────────────────────────────────────────
      const audioFiles = {
        start: {
          male: [
            '../audio/start of drive 1m.mp3',
            '../audio/start of drive 2m.mp3',
            '../audio/start of drive 3m.mp3',
            '../audio/start of drive4m.mp3'
          ],
          female: [
            '../audio/start of drive 1w.mp3',
            '../audio/start of drive 2 w.mp3',
            '../audio/start of drive 3w.mp3',
            '../audio/start of drive 4w.mp3'
          ]
        },
        mid: {
          male: [
            '../audio/mid-drive 1w.mp3',
            '../audio/mid-drive 2w.mp3',
            '../audio/mid-drive 3w.mp3',
            '../audio/mid-drive 4w.mp3'
          ],
          female: [
            '../audio/mid drive 1m.mp3',
            '../audio/mid drive 2m.mp3',
            '../audio/mid drive 3m.mp3',
            '../audio/mid drive 4m.mp3'
          ]
        },
        reminder: {
          male: [
            '../audio/reminder1.mp3',
            '../audio/reminder2.mp3',
            '../audio/reminder3.mp3',
            '../audio/reminder4.mp3',
            '../audio/reminder5.mp3',
            '../audio/reminder6.mp3'
          ],
          female: [
            '../audio/reminder1.mp3',
            '../audio/reminder2.mp3',
            '../audio/reminder3.mp3',
            '../audio/reminder4.mp3',
            '../audio/reminder5.mp3',
            '../audio/reminder6.mp3'
          ]
        }
      };

      // ─── Get Voice Gender ──────────────────────────────────────
      function getGender() {
        if (voicePreference === 'random') {
          return Math.random() > 0.5 ? 'male' : 'female';
        }
        return voicePreference;
      }

      // ─── Get Random File ───────────────────────────────────────
      function getRandomFile(type) {
        const gender = getGender();
        const files = audioFiles[type][gender];
        return files[Math.floor(Math.random() * files.length)];
      }

      // ─── Audio Player ──────────────────────────────────────────
      let currentAudio = null;
      let audioPlaying = false;
      let midDriveInterval = null;

      function playAudio(file) {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
        currentAudio = new Audio(file);
        currentAudio.play().catch(e => console.log('Audio error:', e));
      }

      function toggleAudio() {
        audioPlaying = !audioPlaying;
        const label = document.getElementById('audioLabel');
        const btn = document.getElementById('audioBtn');

        if (audioPlaying) {
          label.textContent = 'Pause Audio';
          btn.classList.add('bg-primary/20');
          playAudio(getRandomFile('reminder'));

          // Play reminder every 3 minutes
          midDriveInterval = setInterval(() => {
            playAudio(getRandomFile('mid'));
          }, 180000);
        } else {
          label.textContent = 'Calm Audio';
          btn.classList.remove('bg-primary/20');
          if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
          }
          clearInterval(midDriveInterval);
        }
      }

      // ─── Unit Toggle ───────────────────────────────────────────
      let isMPH = true;
      const speedMPH = 64, speedKPH = 103;
      const limitMPH = 60, limitKPH = 97;
      const distanceMiles = 12.4, distanceKM = 20.0;

      function toggleUnit() {
        isMPH = !isMPH;
        document.getElementById('speedValue').textContent = isMPH ? speedMPH : speedKPH;
        document.getElementById('currentUnit').textContent = isMPH ? 'MPH' : 'KPH';
        document.getElementById('altSpeed').textContent = isMPH ? speedKPH + ' KPH' : speedMPH + ' MPH';
        document.getElementById('speedLimit').textContent = isMPH ? limitMPH : limitKPH;
        document.getElementById('limitUnit').textContent = isMPH ? 'MPH' : 'KPH';
        document.getElementById('distance').textContent = isMPH ? distanceMiles : distanceKM;
        document.getElementById('distanceUnit').textContent = isMPH ? 'Miles' : 'KM';
      }

      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('unitToggle').addEventListener('click', toggleUnit);
      });

      // ─── Breathing Animation ───────────────────────────────────
      const circle = document.getElementById('breathingCircle');
      const breathText = document.getElementById('breathText');
      const breathTimer = document.getElementById('breathTimer');
      circle.style.setProperty('--breath-duration', breathSeconds + 's');

      let countdown = breathSeconds;
      let phase = 'in';
      let countdownInterval;

      const messages = { in: 'Inhale', hold: 'Hold', out: 'Exhale' };
      const encouragements = [
        "You're doing great",
        "Stay calm and focused",
        "Breathe and relax",
        "You've got this",
        "Nice and easy"
      ];

      function runPhase(p) {
        phase = p;
        countdown = breathSeconds;
        breathText.textContent = messages[phase];
        breathTimer.textContent = countdown;
        circle.classList.remove('breathe-in', 'breathe-out', 'breathe-hold');
        void circle.offsetWidth;
        if (phase === 'in') circle.classList.add('breathe-in');
        else if (phase === 'out') circle.classList.add('breathe-out');
        else circle.classList.add('breathe-hold');

        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
          countdown--;
          breathTimer.textContent = countdown;
          if (countdown <= 0) {
            clearInterval(countdownInterval);
            if (phase === 'in') runPhase('hold');
            else if (phase === 'hold') runPhase('out');
            else {
              const msg = encouragements[Math.floor(Math.random() * encouragements.length)];
              document.getElementById('encouragement').textContent = msg;
              runPhase('in');
            }
          }
        }, 1000);
      }

      // ─── Navigation ───────────────────────────────────────────
      function endDrive() {
        clearInterval(countdownInterval);
        clearInterval(midDriveInterval);
        if (currentAudio) currentAudio.pause();
        window.location.href = 'https://mjuve21-spec.github.io/calmdriveapp/plus/post-drive-summary.html';
      }

      function openSettings() {
        alert('Settings coming soon!');
      }

      // ─── Start Everything ──────────────────────────────────────
      window.onload = function() {
        // Play start of drive audio
        if (voiceEnabled) {
          setTimeout(() => {
            playAudio(getRandomFile('start'));
          }, 1000);
        }

        // Start breathing if enabled
        if (breathingEnabled) {
          runPhase('in');
        }
      };
    </script>
  </body>
</html>
